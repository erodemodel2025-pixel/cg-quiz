<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />
    <title>CG QUIZ — The Engineering Arcade</title>
    <meta name="description" content="Competitive quiz and engineering arcade platform featuring adaptive multi-type quizzes, mock tests, smart explanations, mistake book, analytics, and 6 playable mini-games." />
    <meta property="og:title" content="CG QUIZ — The Engineering Arcade" />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('cgquiz_ui_theme');
          if (mode !== 'light' && mode !== 'dark') {
            mode = 'dark';
          }
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(mode);
          document.documentElement.setAttribute('data-ui-mode', mode);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
